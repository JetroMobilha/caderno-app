<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="O teu caderno inteligente para notas, desenhos e colaboração em tempo real.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caderno">
  <link rel="apple-touch-icon" href="app_icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="app_icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="app_icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="app_icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- PWA Splash Screen for iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0F4C5C">

  <title>Caderno Digital</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build web, do not touch.
    const serviceWorkerVersion = "2928205515" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
  </script>
</head>
<body style="background-color: #FDFBF7;">
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Detect beforeinstallprompt and optionally show install button
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent Chrome 67 and earlier from automatically showing the prompt
      e.preventDefault();
      // Stash the event so it can be triggered later.
      window.deferredPrompt = e;
      console.log('PWA: prompt de instalação detetado e capturado');

      // Notify Flutter that the app is installable
      window.dispatchEvent(new CustomEvent('pwa_installable'));
    });

    window.addEventListener('appinstalled', (evt) => {
      console.log('PWA: App instalada com sucesso');
      window.deferredPrompt = null;
    });

    // Function to trigger the install prompt from Flutter
    window.triggerPwaInstall = () => {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        window.deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('PWA: Utilizador aceitou a instalação');
          } else {
            console.log('PWA: Utilizador recusou a instalação');
          }
          window.deferredPrompt = null;
        });
      }
    };
  </script>
</body>
</html>
