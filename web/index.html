<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="O teu caderno inteligente para notas, desenhos e colaboração em tempo real.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caderno">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- PWA Splash Screen for iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0F4C5C">

  <title>Caderno Digital</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build web, do not touch.
    var serviceWorkerVersion = null;
  </script>
</head>
<body style="background-color: #FDFBF7;">
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Detect beforeinstallprompt and optionally show install button
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent Chrome 67 and earlier from automatically showing the prompt
      // e.preventDefault();
      // Stash the event so it can be triggered later.
      window.deferredPrompt = e;
      console.log('PWA: prompt de instalação detetado');
    });

    window.addEventListener('appinstalled', (evt) => {
      console.log('PWA: App instalada com sucesso');
    });
  </script>
</body>
</html>
